<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Drone Dispatch — learn Python by flying a delivery drone: variables, if/else, lists, loops and functions, then while loops, return values, error handling, classes and sorting.">
<title>Drone Dispatch | Drone Camp Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/mode-python.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.3/src-min-noconflict/theme-tomorrow_night_eighties.js"></script>

<style>
:root{
 --bg:#1b1c19;--panel:#232420;--panel2:#2b2c27;--line:#3a3b34;--ink:#e9e6dc;--dim:#9a978c;
 --green:#7cc242;--green-d:#4f8a24;--magenta:#c3195d;--yellow:#f0b90b;--blue:#4aa3df;--red:#e0533d;
 --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Open Sans",Arial,sans-serif;overflow:hidden}
button{font-family:var(--mono);cursor:pointer}

/* ---------- shell ---------- */
.shell{height:100vh;display:grid;grid-template-columns:var(--col-left,46%) 7px 1fr}
.left{min-width:0;min-height:0;overflow-y:auto;display:grid;grid-template-rows:auto auto 1fr;background:var(--panel);border-right:0}
.right{min-width:0;min-height:0;overflow-y:auto;display:grid;grid-template-rows:auto 1fr;background:#141511}
.gutter{background:var(--line);cursor:col-resize;touch-action:none;display:grid;place-items:center;transition:background .12s}
.gutter::after{content:"";width:3px;height:34px;border-radius:2px;background:rgba(255,255,255,.35)}
.gutter:hover,.gutter.dragging{background:var(--magenta)}
body.resizing{cursor:col-resize;user-select:none}

/* ---------- chapter bar ---------- */
.chapbar{padding:12px 16px 14px;border-bottom:1px solid var(--line);text-align:center;position:relative}
.course{font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.chaprow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.chaptitle{font:700 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.navbtn{background:transparent;color:var(--dim);border:1px solid var(--line);padding:7px 11px;font:700 11px/1 var(--mono);
 letter-spacing:.1em;text-transform:uppercase;border-radius:3px}
.navbtn:hover:not(:disabled){color:var(--ink);border-color:var(--dim)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.navbtn.next{color:var(--green);border-color:var(--green-d)}
.navbtn.next:hover:not(:disabled){background:rgba(124,194,66,.12)}
.pips{display:flex;justify-content:center;gap:7px;margin-top:12px;flex-wrap:wrap}
.pip{width:22px;height:22px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:0;
 font:700 10px/1 var(--mono);color:var(--dim)}
.pip:hover{border-color:var(--dim);color:var(--ink)}
.pip.done{background:var(--green-d);border-color:var(--green);color:#fff}
.pip.current{outline:2px solid var(--yellow);outline-offset:1px;color:var(--ink)}

/* ---------- lesson / learn header ---------- */
.lessonbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lesson-id{font:700 12px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.lesson-sub{font:400 11px/1.3 var(--mono);color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.toggle{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:3px;
 font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.toggle:hover{border-color:var(--green);color:var(--green)}

/* ---------- panes ---------- */
.pane{min-height:0;overflow:auto}
.learn{padding:20px 18px 40px;font-size:14.5px;line-height:1.68;color:#dcd8cc}
.learn h3{margin:0 0 12px;font:700 15px/1.3 "Open Sans";color:#fff}
.learn p{margin:0 0 14px}
.learn code{font:600 13px/1 var(--mono);background:#15160f;border:1px solid var(--line);padding:2px 5px;border-radius:3px;color:var(--yellow)}
.learn pre{margin:0 0 16px;padding:13px 14px;background:#15160f;border:1px solid var(--line);border-radius:4px;
 overflow-x:auto;font:500 12.5px/1.65 var(--mono);color:#cfe8b5;white-space:pre}
.learn ul{margin:0 0 14px;padding-left:20px}
.learn li{margin-bottom:6px}
.learn .tip{border-left:3px solid var(--yellow);background:rgba(240,185,11,.07);padding:11px 13px;margin:0 0 16px;font-size:13.5px}

.code{display:grid;grid-template-rows:auto auto minmax(200px,1fr) auto;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px}
.run{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#10210a;border:0;padding:10px 16px;border-radius:3px;
 font:800 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.run:hover{background:#8ad14e}
.run:disabled{opacity:.55;cursor:not-allowed}
.tool{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 11px;border-radius:3px;
 font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tool:hover{border-color:var(--dim)}
.spacer{flex:1}
.status{font:600 11px/1 var(--mono);color:var(--dim);letter-spacing:.06em}
.brief{margin:0 16px 10px;padding:11px 13px;background:#1f2b16;border:1px solid #33461f;border-radius:4px;
 font-size:13px;line-height:1.55;color:#d5e8c1}
.brief b{color:var(--green)}
#editor{width:100%;height:100%;min-height:200px}
.console{border-top:1px solid var(--line);background:#15160f;max-height:34vh;overflow:auto;padding:11px 14px;
 font:500 12px/1.6 var(--mono);white-space:pre-wrap;color:#c9c6ba;display:none}
.console.show{display:block}
.console .ok{color:var(--green)}
.console .bad{color:var(--red)}
.console .note{color:var(--dim)}

/* ---------- map ---------- */
.maptools{display:flex;align-items:center;gap:8px;padding:12px 16px}
.mapwrap{display:grid;place-items:center;align-content:center;padding:0 16px 20px;min-height:0;overflow:auto}
canvas{image-rendering:pixelated;display:block;border:1px solid #2c2e25;border-radius:4px;background:#0f100c}
.legend{flex:1;display:flex;gap:14px;flex-wrap:wrap;font:600 10px/1.6 var(--mono);color:var(--dim);
 letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.right{position:relative}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.72);display:none;place-items:center;z-index:40;padding:20px;overflow:auto}
.scrim.show{display:grid}
.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:26px 24px;text-align:center;
 box-shadow:0 18px 50px rgba(0,0,0,.5)}
.modal h2{margin:0 0 6px;font:800 26px/1.1 "Open Sans";letter-spacing:-.02em;color:var(--green)}
.modal .lvl{font:700 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
.modal p{margin:0 0 20px;font-size:14px;line-height:1.6;color:#d6d2c6}
.modal .pips{margin:0 0 20px}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal.help{text-align:left}
.modal.help h2{font-size:18px;color:var(--yellow);margin-bottom:14px}
.modal.help p{font-size:13.5px}

@media (max-width:860px){
 body{overflow:auto}
 .shell{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
 .gutter{display:none}
 .left{border-right:0;border-bottom:1px solid var(--line)}
 #editor{height:320px}
 .mapwrap{padding-bottom:30px}
}
</style>
</head>
<body>

<div class="shell" id="shell">
  <section class="left">
    <div class="chapbar">
      <div class="course">Drone Dispatch &middot; Python Flight Course</div>
      <div class="chaprow">
        <button class="navbtn" id="prevBtn">&laquo; Back</button>
        <div class="chaptitle" id="chapTitle">Chapter 1 &gt; Level 1</div>
        <button class="navbtn next" id="nextBtn">Next &raquo;</button>
      </div>
      <div class="pips" id="pips"></div>
    </div>

    <div class="lessonbar">
      <div>
        <div class="lesson-id" id="lessonTitle">Variables</div>
        <div class="lesson-sub" id="lessonSub">Starting out</div>
      </div>
      <button class="toggle" id="modeToggle">&lt;&gt; Back to coding</button>
    </div>

    <div class="pane" id="learnPane">
      <div class="learn" id="learnBody"></div>
    </div>

    <div class="pane code" id="codePane" hidden>
      <div class="toolbar">
        <button class="run" id="runBtn">&#9654; Run code</button>
        <button class="tool" id="resetBtn">&#8635; Reset</button>
        <button class="tool" id="saveBtn">&#128190; Save</button>
        <button class="tool" id="loadBtn">&#8593; Load</button>
        <button class="tool" id="helpBtn">?</button>
        <span class="spacer"></span>
        <span class="status" id="status">Loading Python&hellip;</span>
      </div>
      <div class="brief" id="brief"></div>
      <div style="min-height:0;position:relative"><div id="editor"></div></div>
      <div class="console" id="console"></div>
    </div>
  </section>

  <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize panels"></div>

  <section class="right">
    <div class="maptools">
      <div class="legend" id="legend"></div>
      <button class="tool" id="mapInfoBtn">&#9432; Map info</button>
      <button class="tool" id="replayBtn">&#9654; Replay</button>
    </div>
    <div class="mapwrap"><canvas id="map" width="640" height="440"></canvas></div>
  </section>
</div>

<div class="scrim" id="scrim">
  <div class="modal" id="modal"></div>
</div>

<script>
/* =====================================================================
   Drone Dispatch — a split-screen Python game for Drone Camp.
   Left: Learn / Code.  Right: a pixel tile map the code actually flies.
   Student code runs in Pyodide, records drone commands, and the recorded
   commands are then simulated and animated on the canvas.
   ===================================================================== */

const TILE = 24;                       // canvas pixels per map tile
const STORAGE = "drone-dispatch-v1";

/* ---------------------------------------------------------------------
   Map legend used by every level string map:
     .  empty sky        #  building (blocked)     T  tree (blocked)
     W  storm cell (blocked)                       H  home pad (start + land)
     A B C D  landing pads, named                  *  waypoint marker
   The drone always starts on H facing east.
   ------------------------------------------------------------------ */

const CHAPTERS = [
  {
    name:"Variables",
    sub:"Chapter 1",
    learn:`<h3>Variables hold a number you can change</h3>
<p>A <b>variable</b> is a name for a value. You make one with <code>=</code>. The name goes on the left, the value on the right.</p>
<pre>distance = 40
drone.forward(distance)</pre>
<p>That flies forward 40&nbsp;cm. Every <b>10&nbsp;cm is one tile</b> on the map, so <code>forward(40)</code> moves four tiles.</p>
<p>The point of a variable is that you change it in one place. Change <code>distance</code> to <code>70</code> and the drone flies further &mdash; you never touch the <code>forward</code> line again.</p>
<div class="tip">Every mission starts with <code>drone.takeoff()</code> and ends with <code>drone.land()</code>. These are the real EasyTello commands &mdash; the same lines fly a real Tello.</div>
<h3>Your flight commands</h3>
<ul>
<li><code>drone.takeoff()</code> &mdash; lift off</li>
<li><code>drone.land()</code> &mdash; set down on the tile you are over</li>
<li><code>drone.forward(cm)</code> / <code>drone.back(cm)</code></li>
<li><code>drone.left(cm)</code> / <code>drone.right(cm)</code> &mdash; slide sideways</li>
<li><code>drone.up(cm)</code> / <code>drone.down(cm)</code> &mdash; change height</li>
<li><code>drone.cw(90)</code> / <code>drone.ccw(90)</code> &mdash; turn clockwise / counter-clockwise</li>
<li><code>drone.flip("f")</code> &mdash; barrel roll: <code>"l"</code>, <code>"r"</code>, <code>"f"</code>, <code>"b"</code></li>
<li><code>drone.speed(cm_per_s)</code> &mdash; 10 to 100</li>
<li><code>drone.get_battery()</code> &mdash; ask the drone how much charge is left</li>
<li><code>drone.deliver()</code> &mdash; drop a package on the pad below you</li>
</ul>
<p>Only <code>deliver()</code> is made up for this game &mdash; a real Tello carries nothing. Every other name above is straight out of EasyTello.</p>
<div class="tip"><b>Turning changes what "forward" means.</b> The drone starts facing east. After <code>drone.cw(90)</code> it faces south, so <code>forward()</code> now flies south. Watch the yellow nose on the sprite.</div>`
  },
  {
    name:"If / Else",
    sub:"Chapter 2",
    learn:`<h3>Let the drone decide</h3>
<p>An <b>if statement</b> runs code only when something is true. The <code>else</code> block runs when it is not.</p>
<pre>battery = 35

if battery >= 30:
    drone.forward(90)
else:
    drone.forward(30)</pre>
<p>The indented lines belong to the branch above them. Python uses that indentation to know which lines are inside the <code>if</code>.</p>
<h3>Comparisons</h3>
<ul>
<li><code>==</code> equal &nbsp; <code>!=</code> not equal</li>
<li><code>&gt;</code> &nbsp; <code>&lt;</code> &nbsp; <code>&gt;=</code> &nbsp; <code>&lt;=</code></li>
</ul>
<p>Comparing text uses quotes: <code>if weather == "storm":</code></p>
<div class="tip">Mission control hands you data at the top of the level, like <code>battery</code> or <code>weather</code>. Read it &mdash; do not change it &mdash; and branch on it.</div>`
  },
  {
    name:"Lists",
    sub:"Chapter 3",
    learn:`<h3>One name, many values</h3>
<p>A <b>list</b> stores several values in order, inside square brackets:</p>
<pre>stops = [40, 30, 40]</pre>
<p>You reach an item by its <b>index</b>, and indexes start at <b>0</b>:</p>
<pre>stops[0]   # 40  (first)
stops[1]   # 30  (second)
stops[2]   # 40  (third)</pre>
<p><code>len(stops)</code> tells you how many items there are &mdash; here, 3. The last index is always <code>len(stops) - 1</code>.</p>
<pre>drone.forward(stops[0])
drone.deliver()
drone.forward(stops[1])
drone.deliver()</pre>
<div class="tip">Asking for <code>stops[3]</code> in a 3-item list crashes with <code>IndexError</code>. Counting from zero trips up everybody at first.</div>`
  },
  {
    name:"For Loops",
    sub:"Chapter 4",
    learn:`<h3>Repeat without retyping</h3>
<p>A <b>for loop</b> runs the same block once per item. To repeat a fixed number of times, loop over <code>range</code>:</p>
<pre>for i in range(4):
    drone.forward(40)
    drone.cw(90)</pre>
<p>That is a square: fly, turn right, four times. <code>range(4)</code> counts 0, 1, 2, 3.</p>
<h3>Looping over a list</h3>
<pre>stops = [40, 30, 40]

for distance in stops:
    drone.forward(distance)
    drone.deliver()</pre>
<p>Each time around, <code>distance</code> becomes the next item in the list. Three items means three trips &mdash; and it still works if you add a fourth stop.</p>
<div class="tip">Everything indented under the <code>for</code> line repeats. The moment you un-indent, you are outside the loop.</div>
<h3>Show off while you are at it</h3>
<pre>drone.flip("f")</pre>
<p>A real Tello barrel rolls on that command. The direction is one letter: <code>"l"</code> left, <code>"r"</code> right, <code>"f"</code> forward, <code>"b"</code> back. Put it inside a loop and the drone celebrates at every stop.</p>`
  },
  {
    name:"Functions",
    sub:"Chapter 5",
    learn:`<h3>Name a routine once, reuse it</h3>
<p>A <b>function</b> is a block of code with a name. You <code>def</code>ine it once, then call it as often as you like:</p>
<pre>def hop(distance):
    drone.forward(distance)
    drone.deliver()

hop(40)
hop(30)</pre>
<p>The word in the parentheses is a <b>parameter</b> &mdash; a variable that gets its value when you call the function. <code>hop(40)</code> runs the body with <code>distance</code> set to 40.</p>
<p>Defining a function does not run it. Nothing happens until a line calls it by name.</p>
<div class="tip">A function can hold a loop, and a loop can call a function. That is how a long mission stays short and readable.</div>`
  },
  {
    name:"Dictionaries",
    sub:"Chapter 6",
    learn:`<h3>Look things up by name</h3>
<p>A list finds items by position. A <b>dictionary</b> finds them by <b>key</b>:</p>
<pre>mission = {"distance": 40, "priority": 1}

mission["distance"]   # 40
mission["priority"]   # 1</pre>
<p>Dictionaries nest, which is how real mission data looks:</p>
<pre>MISSIONS = {
    "school":  {"distance": 40, "priority": 1},
    "clinic":  {"distance": 70, "priority": 2},
}

drone.forward(MISSIONS["school"]["distance"])</pre>
<h3>Looping over one</h3>
<pre>for name in MISSIONS:
    stop = MISSIONS[name]
    if stop["priority"] == 1:
        drone.forward(stop["distance"])</pre>
<div class="tip">A missing key raises <code>KeyError</code>. Keys are case sensitive: <code>"School"</code> is not <code>"school"</code>.</div>`
  },
  {
    name:"Final Mission",
    sub:"Chapter 7",
    learn:`<h3>Everything at once</h3>
<p>This closes the core course. No new ideas &mdash; you combine the six you already have:</p>
<ul>
<li>a <b>variable</b> for something you might tune</li>
<li>an <b>if</b> to react to the weather</li>
<li>a <b>list</b> of the stops to make</li>
<li>a <b>for loop</b> to visit them all</li>
<li>a <b>function</b> for the routine you repeat</li>
<li>a <b>dictionary</b> holding each stop's data</li>
</ul>
<p>The mission checker does not compare your code to one right answer. It looks at what the drone actually did on the map, and confirms you used all six tools to get there.</p>
<div class="tip">Build it one stop at a time. Run early, run often &mdash; a half-finished flight that runs beats a whole one that does not.</div>
<p>Clear it and the <b>advanced track</b> opens: eight more chapters, each one harder than the last.</p>`
  },

  /* ---------------- advanced track ---------------- */
  {
    name:"While Loops",
    sub:"Chapter 8",
    learn:`<h3>Repeat until something changes</h3>
<p>A <code>for</code> loop runs a set number of times. A <b>while loop</b> keeps going <i>as long as</i> a condition is true:</p>
<pre>packages = 3

while packages > 0:
    drone.forward(20)
    drone.deliver()
    packages -= 1</pre>
<p><code>packages -= 1</code> is short for <code>packages = packages - 1</code>. Each time around, the count drops: 3, 2, 1, 0 &mdash; and at 0 the condition is false, so the loop stops.</p>
<div class="tip"><b>The classic bug:</b> forget to change the variable and the condition never turns false. The loop runs forever. The game stops your code after 600 drone commands or 5 seconds &mdash; a real drone would just keep flying.</div>
<h3>Working through a list</h3>
<p><code>.pop(0)</code> removes the first item of a list and hands it to you. An empty list counts as false, so this runs until the list is used up:</p>
<pre>queue = [40, 30, 40]

while queue:
    distance = queue.pop(0)
    drone.forward(distance)</pre>`
  },
  {
    name:"Elif and Logic",
    sub:"Chapter 9",
    learn:`<h3>More than two choices</h3>
<p><code>if</code>/<code>else</code> picks between two paths. <code>elif</code> (&ldquo;else if&rdquo;) adds as many as you need. Python checks them top to bottom and runs the <b>first</b> one that is true:</p>
<pre>if weather == "clear":
    drone.forward(120)
elif weather == "wind":
    drone.forward(50)
else:
    print("too dangerous")</pre>
<div class="tip">From here on, some levels fly your code <b>more than once</b>, with different data each time. Code that only works for one forecast will not pass &mdash; just like real software is tested against many inputs.</div>
<h3>Combining conditions</h3>
<ul>
<li><code>a and b</code> &mdash; true only if <b>both</b> are true</li>
<li><code>a or b</code> &mdash; true if <b>either</b> is true</li>
<li><code>not a</code> &mdash; flips true and false</li>
</ul>
<pre>if wind &lt; 20 and pad_open:
    drone.deliver()</pre>
<p>Python's true and false are spelled <code>True</code> and <code>False</code>, with a capital letter.</p>`
  },
  {
    name:"Return Values",
    sub:"Chapter 10",
    learn:`<h3>Functions that answer back</h3>
<p>The functions so far <i>did</i> something. A function can also <b>work something out</b> and hand the answer back with <code>return</code>:</p>
<pre>def to_cm(tiles):
    return tiles * 10

distance = to_cm(4)     # distance is now 40
drone.forward(distance)</pre>
<p>The call <code>to_cm(4)</code> is replaced by whatever the function returns. You can store it, print it, or pass it straight into another call: <code>drone.forward(to_cm(4))</code>.</p>
<h3>Adding things up</h3>
<pre>def total(hops):
    flown = 0
    for hop in hops:
        flown += hop
    return flown</pre>
<p>That pattern &mdash; start at zero, add each item, return the result &mdash; is called an <b>accumulator</b>. Python has it built in as <code>sum(hops)</code>, but now you know what it does inside.</p>
<div class="tip"><code>print</code> shows a value to <i>you</i>. <code>return</code> gives it to <i>the code</i>. A function with no <code>return</code> hands back <code>None</code>.</div>`
  },
  {
    name:"Nested Loops",
    sub:"Chapter 11",
    learn:`<h3>A loop inside a loop</h3>
<p>Put one loop inside another and the inner one runs <b>completely</b> for every single turn of the outer one:</p>
<pre>for row in range(3):
    for step in range(4):
        drone.forward(10)
    drone.right(20)</pre>
<p>That flies 4 steps, slides over, and repeats &mdash; 3 rows of 4 steps, 12 moves from 5 lines.</p>
<h3>Lists of lists</h3>
<p>A list can hold other lists. That is how you store a grid or a set of routes:</p>
<pre>STREETS = [
    [30, 30],       # STREETS[0]
    [20, 40, 30],   # STREETS[1]
]

for street in STREETS:
    for hop in street:
        drone.forward(hop)</pre>
<h3>Even or odd? Use %</h3>
<p><code>%</code> gives the remainder after dividing. <code>row % 2</code> is <code>0</code> for even rows and <code>1</code> for odd ones &mdash; perfect for zig-zagging back and forth.</p>`
  },
  {
    name:"Handling Errors",
    sub:"Chapter 12",
    learn:`<h3>When things go wrong</h3>
<p>Real data is messy. A radio glitch turns <code>"30"</code> into <code>"3O"</code>, and <code>int("3O")</code> crashes with a <code>ValueError</code>. A missing name in a dictionary crashes with a <code>KeyError</code>.</p>
<p><code>try</code>/<code>except</code> lets you <b>catch</b> the crash and decide what to do instead:</p>
<pre>try:
    distance = int(text)
except ValueError:
    print("bad reading:", text)
    distance = 30          # a safe default</pre>
<p>Python runs the <code>try</code> block. If it raises the error you named, it jumps to <code>except</code> instead of stopping your whole program.</p>
<h3>Checking first</h3>
<p>Sometimes it is cleaner to check before you leap:</p>
<pre>if name in ADDRESSES:
    drone.forward(ADDRESSES[name])</pre>
<div class="tip">Name the error you expect: <code>except ValueError:</code>. A bare <code>except:</code> also hides typos and real bugs, which makes them much harder to find.</div>`
  },
  {
    name:"Classes",
    sub:"Chapter 13",
    learn:`<h3>Bundle data and behaviour together</h3>
<p>A <b>class</b> is a blueprint. Each <b>object</b> made from it carries its own data (<b>attributes</b>) and its own functions (<b>methods</b>):</p>
<pre>class Package:
    def __init__(self, distance, fragile):
        self.distance = distance
        self.fragile = fragile

    def drop(self):
        drone.forward(self.distance)
        drone.deliver()

box = Package(40, False)   # runs __init__
box.drop()                 # runs drop with self = box</pre>
<ul>
<li><code>__init__</code> runs once, when the object is created, to set it up.</li>
<li><code>self</code> is the object itself. <code>self.distance</code> is <i>this</i> package's distance.</li>
<li>Every method takes <code>self</code> first, but you never pass it &mdash; Python does.</li>
</ul>
<div class="tip">Objects remember. Change <code>self.flown</code> inside a method and the new value is still there the next time you call it. That is what makes them useful for keeping track of state.</div>`
  },
  {
    name:"Sorting and Comprehensions",
    sub:"Chapter 14",
    learn:`<h3>Build a list in one line</h3>
<p>A <b>list comprehension</b> makes a new list from an old one:</p>
<pre>tiles = [3, 4, 2]
cm = [t * 10 for t in tiles]          # [30, 40, 20]</pre>
<p>Add an <code>if</code> on the end to <b>filter</b> as you go:</p>
<pre>good = [t * 10 for t in tiles if t > 2]   # [30, 40]</pre>
<h3>Put things in order</h3>
<p><code>sorted(...)</code> returns a new, sorted list. <code>my_list.sort()</code> sorts a list in place.</p>
<pre>sorted([90, 30, 60])      # [30, 60, 90]</pre>
<p>To sort by something other than the items themselves, give it a <code>key</code>. A <b>lambda</b> is a tiny one-line function:</p>
<pre>STOPS = {"bank": 90, "zoo": 30}
sorted(STOPS, key=lambda name: STOPS[name])   # ["zoo", "bank"]</pre>
<div class="tip">Sorting a dictionary gives you its <b>keys</b>, in alphabetical order unless you pass a <code>key</code>. Alphabetical is rarely the order a drone wants.</div>`
  },
  {
    name:"Grand Finale",
    sub:"Chapter 15",
    learn:`<h3>The night shift</h3>
<p>The last mission uses the advanced tools together:</p>
<ul>
<li>a <b>function that returns</b> a clean number from messy text</li>
<li><b>try / except</b> to survive a garbled reading</li>
<li><b>sorting</b> to plan the shortest route</li>
<li>a <b>while loop</b> to work through the queue</li>
<li>an <b>if</b> to dodge the storm</li>
</ul>
<p>Plan it before you code it. Write the steps as comments first, then fill them in one at a time and run after each.</p>
<div class="tip">The distances in this mission are measured from <b>home</b>, not from the last stop. If you are at 40 and the next stop is at 90, you fly <code>90 - 40</code>.</div>`
  }

    if(s.crashed) return fail(s.crashed);
    if(!["A","B","C"].every(p => s.delivered.includes(p)))
      return fail("Deliver to the farm (A), market (B) and clinic (C). So far: " + soFar(s) + ".");

      return fail("All three delivered, but not nearest-first. Your order: " + soFar(s) + ".");

function ok(){ return {pass:true}; }
function fail(msg){ return {pass:false, msg}; }
function where(s){ return s.landedOn ? "pad " + s.landedOn : (s.flying ? "still in the air at (" + s.x + ", " + s.y + ")" : "(" + s.x + ", " + s.y + ")"); }
function soFar(s){ return s.delivered.join(", ") || "none"; }

const FEATURE_LABEL = {
  "if":"an if statement", "for":"a for loop", "def":"a function definition",
  "list":"a list", "dict":"a dictionary lookup", "assign":"a variable",
  "while":"a while loop", "elif":"an elif branch", "boolop":"and / or",
  "return":"a function that returns a value", "nested":"a loop inside a loop",
  "try":"try / except", "class":"a class", "sort":"sorted() or .sort()",
  "comp":"a list comprehension"
};

/* A level is flown once per case. Most levels have a single implicit case
   built from their own inject/battery; a level with `cases` is flown once
   for each, and only passes when every case does. */
function levelCases(L){
  return L.cases || [{inject: L.inject || {}, battery: L.battery}];
}

/* One verdict for one flight: crash, then missing features, then the goal. */
function grade(L, res, sim, c){
  if(sim.crashed) return fail(sim.crashed);
  const missing = (L.requires || []).filter(f => !res.features[f]);
  if(missing.length)
    return fail("The flight looks right, but this level asks you to use " +
                missing.map(f => FEATURE_LABEL[f] || f).join(" and ") + ".");
  return L.goal(sim, c);
}

/* ==================== Python side ==================== */

const PRELUDE = `
import sys, time, ast, json, io
from contextlib import redirect_stdout

GUARD_SECONDS = 5.0
_deadline = [0.0]

def _watchdog(frame, event, arg):
    if time.time() > _deadline[0]:
        raise TimeoutError("Your code ran too long (over 5 seconds). Look for a loop that never stops.")
    return _watchdog

class Drone:
    """Mirrors the easytello Tello API, so anything a camper writes here is
    the same call they would send to a real drone. deliver() is the one
    exception -- that is the game's own verb, since a Tello carries nothing."""
    LIMIT = 600
    FLIPS = {"l": "left", "r": "right", "f": "forward", "b": "back"}

    def __init__(self, battery=87):
        self.log = []
        self._battery = int(battery)

    def _push(self, row):
        if len(self.log) >= self.LIMIT:
            raise RuntimeError("That is more than 600 drone commands. Something is repeating forever.")
        self.log.append(row)

    def _rec(self, name, *vals):
        row = [name]
        for v in vals:
            if isinstance(v, bool) or not isinstance(v, (int, float)):
                raise TypeError("drone.%s() needs a number, got %r" % (name, v))
            row.append(int(v))
        self._push(row)

    # --- flight ---
    def takeoff(self):        self._rec("takeoff")
    def land(self):           self._rec("land")
    def forward(self, cm):    self._rec("forward", cm)
    def back(self, cm):       self._rec("back", cm)
    def left(self, cm):       self._rec("left", cm)
    def right(self, cm):      self._rec("right", cm)
    def up(self, cm):         self._rec("up", cm)
    def down(self, cm):       self._rec("down", cm)
    def cw(self, deg):        self._rec("cw", deg)
    def ccw(self, deg):       self._rec("ccw", deg)

    def flip(self, direction):
        d = str(direction).strip().lower()
        if d not in self.FLIPS:
            raise ValueError(
                "drone.flip() takes 'l', 'r', 'f' or 'b' (left, right, forward, back), got %r" % (direction,))
        self._push(["flip", d])

    def speed(self, cm_per_s):
        if isinstance(cm_per_s, bool) or not isinstance(cm_per_s, (int, float)):
            raise TypeError("drone.speed() needs a number, got %r" % (cm_per_s,))
        if not 10 <= cm_per_s <= 100:
            raise ValueError("drone.speed() takes 10 to 100 cm/s, got %r" % (cm_per_s,))
        self._rec("speed", cm_per_s)

    def emergency(self):      self._rec("emergency")

    # --- telemetry and video, same names easytello uses ---
    def get_battery(self):    return self._battery
    def get_speed(self):      return 30
    def get_time(self):       return len(self.log)
    def streamon(self):       self._rec("streamon")
    def streamoff(self):      self._rec("streamoff")

    # --- the game's own verb ---
    def deliver(self):        self._rec("deliver")
    def wait(self, s=1):      self._rec("wait", s)

_LOOPS = (ast.For, ast.While)
_TRIES = (ast.Try, ast.TryStar) if hasattr(ast, "TryStar") else (ast.Try,)

def _features(tree):
    f = {"if": False, "for": False, "def": False, "list": False,
         "dict": False, "assign": False, "while": False,
         "elif": False, "boolop": False, "return": False, "nested": False,
         "try": False, "class": False, "sort": False, "comp": False}
    for n in ast.walk(tree):
        # advanced-track constructs; independent of the chain below
        # a real elif sits at its parent's column; else: + nested if is indented
        if (isinstance(n, ast.If) and len(n.orelse) == 1 and isinstance(n.orelse[0], ast.If)
                and n.orelse[0].col_offset == n.col_offset):
            f["elif"] = True
        if isinstance(n, ast.BoolOp):                    f["boolop"] = True
        if isinstance(n, ast.Return) and n.value is not None: f["return"] = True
        if isinstance(n, _TRIES) and n.handlers:         f["try"] = True
        if isinstance(n, ast.ClassDef):                  f["class"] = True
        if isinstance(n, ast.ListComp):                  f["comp"] = True
        if isinstance(n, ast.Call) and (
                (isinstance(n.func, ast.Name) and n.func.id == "sorted") or
                (isinstance(n.func, ast.Attribute) and n.func.attr == "sort")):
            f["sort"] = True
        if isinstance(n, _LOOPS) and any(
                isinstance(m, _LOOPS) for stmt in n.body for m in ast.walk(stmt)):
            f["nested"] = True

        if isinstance(n, ast.If):                       f["if"] = True
        elif isinstance(n, (ast.For, ast.comprehension)): f["for"] = True
        elif isinstance(n, ast.While):                  f["while"] = True
        elif isinstance(n, (ast.FunctionDef,)):         f["def"] = True
        elif isinstance(n, ast.List):                   f["list"] = True
        elif isinstance(n, ast.Dict):                   f["dict"] = True
        elif isinstance(n, (ast.Assign, ast.AugAssign)): f["assign"] = True
        elif isinstance(n, ast.Subscript):
            # a string key means a dictionary lookup; a number means a list index
            sl = n.slice
            if isinstance(sl, ast.Constant) and isinstance(sl.value, str):
                f["dict"] = True
            else:
                f["list"] = True
    return f

def run_mission(src, level_json):
    data = json.loads(level_json)
    try:
        tree = ast.parse(src)
    except SyntaxError as e:
        return json.dumps({"ok": False, "log": [], "stdout": "", "features": {},
                           "error": "SyntaxError on line %s: %s" % (e.lineno, e.msg)})
    feats = _features(tree)
    d = Drone(battery=data.get("battery", 87))
    ns = {"drone": d, "__name__": "__mission__"}
    ns.update(data.get("inject", {}))
    out = io.StringIO()
    err = None
    _deadline[0] = time.time() + GUARD_SECONDS
    sys.settrace(_watchdog)
    try:
        with redirect_stdout(out):
            exec(compile(tree, "<mission>", "exec"), ns)
    except Exception as e:
        err = "%s: %s" % (type(e).__name__, e)
    finally:
        sys.settrace(None)
    return json.dumps({"ok": err is None, "error": err, "log": d.log,
                       "stdout": out.getvalue(), "features": feats})
`;

/* ==================== simulation ==================== */

const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];   // 0 E, 1 S, 2 W, 3 N
const BLOCKED = new Set(["#","T","W"]);

function parseMap(rows){
  const grid = rows.map(r => r.split(""));
  const h = grid.length, w = grid[0].length;
  let start = null; const pads = {}; const waypoints = [];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const c = grid[y][x];
    if(c === "H"){ start = {x,y}; pads["H"] = {x,y}; }
    else if(/[A-G]/.test(c)) pads[c] = {x,y};
    else if(c === "*") waypoints.push({x,y});
  }
  return {grid, w, h, start, pads, waypoints};
}

/* Replays the recorded command log against the map and returns both the
   final state and the frame list the canvas animates. */
function simulate(log, map){
  const st = {
    x: map.start.x, y: map.start.y, heading: 0, flying: false,
    delivered: [], landedOn: "H", waypoints: 0, crashed: null,
    flips: [], flipPads: [], speed: 30
  };
  const seenWp = new Set();
  const frames = [{x:st.x, y:st.y, heading:0, flying:false, event:null, speed:30, roll:0}];
  const push = (ev, extra) => frames.push(Object.assign(
    {x:st.x, y:st.y, heading:st.heading, flying:st.flying, event:ev, speed:st.speed, roll:0}, extra || {}));

  const padAt = (x,y) => Object.keys(map.pads).find(k => map.pads[k].x===x && map.pads[k].y===y) || null;
  // Every early exit runs through here, so it must attach the frames the
  // animation needs — returning without them leaves the UI stuck mid-flight.
  const stop = (msg) => { st.crashed = msg; push("crash"); st.frames = frames; return st; };

  for(const cmd of log){
    const [name, arg] = cmd;

    if(name === "takeoff"){
      if(st.flying) continue;
      st.flying = true; st.landedOn = null; push("takeoff"); continue;
    }
    if(name === "land"){
      if(!st.flying){ continue; }
      st.flying = false; st.landedOn = padAt(st.x, st.y); push("land"); continue;
    }
    if(name === "deliver"){
      if(!st.flying) return stop("The drone tried to deliver while sitting on the ground. Take off first.");
      const pad = padAt(st.x, st.y);
      if(!pad || pad === "H") return stop("Nothing to deliver to at (" + st.x + ", " + st.y + ") — the drone is not over a landing pad.");
      if(!st.delivered.includes(pad)) st.delivered.push(pad);
      push("deliver"); continue;
    }
    if(name === "cw" || name === "ccw"){
      const quarters = Math.round((arg || 0) / 90) * (name === "cw" ? 1 : -1);
      st.heading = ((st.heading + quarters) % 4 + 4) % 4;
      push("turn"); continue;
    }
    if(name === "flip"){
      if(!st.flying) return stop("The drone has to be in the air to flip. Call drone.takeoff() first.");
      st.flips.push(arg);
      st.flipPads.push(padAt(st.x, st.y));   // where it flipped, for goals that care
      // four frames of roll so the sprite visibly completes the barrel roll
      for(let j = 1; j <= 4; j++) push("flip", {roll: j / 4, dir: arg});
      continue;
    }
    if(name === "speed"){ st.speed = Math.max(10, Math.min(100, arg || 30)); push(null); continue; }
    if(name === "emergency"){
      // motors cut — the drone stops where it is, exactly like the real command
      if(!st.flying) continue;
      st.flying = false; st.landedOn = padAt(st.x, st.y); push("land"); continue;
    }
    if(name === "up" || name === "down" || name === "wait" ||
       name === "streamon" || name === "streamoff"){ push(null); continue; }

    // movement
    const offset = {forward:0, right:1, back:2, left:3}[name];
    if(offset === undefined) continue;
    if(!st.flying) return stop("The drone is still on the ground. Call drone.takeoff() before moving.");

    let tiles = Math.round((arg || 0) / 10);
    let dir = (st.heading + offset) % 4;
    if(tiles < 0){ tiles = -tiles; dir = (dir + 2) % 4; }   // negative distance = opposite way
    const [dx, dy] = DIRS[dir];

    for(let i=0;i<tiles;i++){
      const nx = st.x + dx, ny = st.y + dy;
      if(nx < 0 || ny < 0 || nx >= map.w || ny >= map.h)
        return stop("The drone flew off the edge of the map.");
      const cell = map.grid[ny][nx];
      if(BLOCKED.has(cell))
        return stop(cell === "W"
          ? "The drone flew straight into the storm at (" + nx + ", " + ny + ")."
          : "The drone crashed into an obstacle at (" + nx + ", " + ny + ").");
      st.x = nx; st.y = ny;
      if(map.grid[ny][nx] === "*"){
        const key = nx + "," + ny;
        if(!seenWp.has(key)){ seenWp.add(key); st.waypoints++; }
      }
      push("move");
    }
  }
  st.frames = frames;
  return st;
}

/* ==================== rendering ==================== */

const PALETTE = {
  ".":null, "#":"building", "T":"tree", "W":"storm", "H":"home", "*":"waypoint"
};

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let currentMap = null, anim = null;

function fitCanvas(map){
  canvas.width = map.w * TILE;
  canvas.height = map.h * TILE;
}

/* The canvas draws at one pixel-art resolution and is scaled up with CSS.
   Whole-number scales keep the pixels square instead of smearing them. */
function layoutCanvas(){
  if(!currentMap) return;
  const wrap = canvas.parentElement;
  const availW = wrap.clientWidth, availH = wrap.clientHeight;
  if(availW < 40 || availH < 40) return;
  const natW = currentMap.w * TILE, natH = currentMap.h * TILE;
  const raw = Math.min(availW / natW, availH / natH);
  const scale = raw >= 1 ? Math.floor(raw) : raw;
  canvas.style.width  = Math.floor(natW * scale) + "px";
  canvas.style.height = Math.floor(natH * scale) + "px";
}
window.addEventListener("resize", layoutCanvas);

function px(x,y,w,h,color){ ctx.fillStyle = color; ctx.fillRect(x,y,w,h); }

function drawTileBase(x,y){
  const gx = x*TILE, gy = y*TILE;
  // bright/dark checkerboard turf, with a few deterministic darker blades so
  // the grass reads as ground rather than as flat squares
  const light = ((x + y) % 2 === 0);
  px(gx, gy, TILE, TILE, light ? "#57a33e" : "#437f30");
  const speck = light ? "#4c9436" : "#3a7229";
  const seed = (x * 7 + y * 13) % 4;
  px(gx + 3 + seed * 3, gy + 5 + ((x + y) % 3) * 5, 3, 2, speck);
  px(gx + 13 - seed * 2, gy + 15 - ((x * 3 + y) % 3) * 4, 2, 3, speck);
  // dusk shading along the south-east of each tile
  px(gx, gy + TILE - 2, TILE, 2, "rgba(20,40,15,.18)");
  px(gx + TILE - 2, gy, 2, TILE, "rgba(20,40,15,.12)");
}

function drawBuilding(gx,gy){
  px(gx+1, gy+4, TILE-2, TILE-4, "rgba(18,34,14,.35)");   // shadow on the turf
  px(gx+2, gy+3, TILE-4, TILE-5, "#6b6f7d");
  px(gx+2, gy+3, TILE-4, 3, "#8d92a1");
  px(gx+2, gy+3, 2, TILE-5, "#7d8291");
  for(let i=0;i<2;i++) for(let j=0;j<2;j++)
    px(gx+6+i*7, gy+8+j*6, 4, 4, "#ffe08a");             // lit windows at dusk
}
function drawTree(gx,gy){
  px(gx+4, gy+17, 16, 5, "rgba(14,28,10,.34)");
  px(gx+9, gy+14, 6, 8, "#3a2410");                  // trunk, outlined
  px(gx+10, gy+14, 4, 7, "#7d5424");
  px(gx+3, gy+2, 18, 15, "#173d13");                 // canopy outline
  px(gx+4, gy+3, 16, 13, "#2b7825");
  px(gx+6, gy+4, 9, 6, "#4aab39");                   // sunlit top-left
  px(gx+15, gy+8, 4, 4, "#4aab39");
  px(gx+8, gy+12, 4, 3, "#1f5c1a");                  // shaded underside
}
function drawStorm(gx,gy){
  px(gx, gy, TILE, TILE, "#333a5c");
  px(gx+3, gy+6, 18, 8, "#6a7398");
  px(gx+7, gy+3, 11, 6, "#828bb0");
  px(gx+9, gy+14, 3, 5, "#f0d54a");
  px(gx+11, gy+17, 3, 4, "#f0d54a");
  px(gx+15, gy+15, 3, 5, "#f0d54a");
}
function drawPad(gx,gy,label,delivered){
  px(gx+1, gy+1, TILE-2, TILE-2, delivered ? "#1f5a1a" : "#6b5320");
  px(gx+2, gy+2, TILE-4, TILE-4, delivered ? "#3f9b2c" : "#a37f2c");
  px(gx+4, gy+4, TILE-8, TILE-8, delivered ? "#8ada54" : "#f5c94e");
  ctx.fillStyle = "#1b1c19";
  ctx.font = "700 11px " + "JetBrains Mono, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, gx + TILE/2, gy + TILE/2 + 1);
}
function drawHome(gx,gy){
  px(gx+1, gy+1, TILE-2, TILE-2, "#20344b");
  px(gx+2, gy+2, TILE-4, TILE-4, "#3f6a96");
  px(gx+4, gy+4, TILE-8, TILE-8, "#5b9ad2");
  px(gx+9, gy+7, 6, 10, "#f2f7ff");
  px(gx+7, gy+9, 10, 6, "#f2f7ff");
}
function drawWaypoint(gx,gy,hit){
  const c = hit ? "#a6f05a" : "#ffcc1f";
  px(gx+10, gy+5, 4, 14, c);
  px(gx+5, gy+10, 14, 4, c);
  px(gx+8, gy+8, 8, 8, c);
}
/* The sprite is drawn once, nose east, then rotated into its heading.
   `roll` (0..1) is a flip in progress and spins it a full extra turn. */
function drawDrone(cx,cy,heading,flying,roll){
  const s = TILE;
  if(flying){
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(cx - s/2 + 5, cy + s/2 - 3, s - 10, 4);
  }
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.rotate(heading * Math.PI/2 + (roll || 0) * Math.PI*2);
  // a flip squashes the silhouette as it goes over the top
  if(roll) ctx.scale(1, Math.max(.35, Math.abs(Math.cos(roll * Math.PI*2))));
  const h = s/2;
  // rotors
  px(-h+2, -h+4, 6, 3, "#cfd4e0");
  px( h-8, -h+4, 6, 3, "#cfd4e0");
  px(-h+2,  h-7, 6, 3, "#cfd4e0");
  px( h-8,  h-7, 6, 3, "#cfd4e0");
  // body, with a dark outline so it stays readable over bright turf
  px(-h+6, -h+6, s-12, s-12, "#3d0a1e");
  px(-h+7, -h+7, s-14, s-14, "#e8246f");
  px(-h+9, -h+9, s-18, 3, "#ffffff");
  // nose marker, always at the front of the canonical sprite
  px(h-10, -3, 6, 6, "#2a1206");
  px(h-9,  -2, 4, 4, "#ffd21f");
  ctx.restore();
}

function render(map, state, deliveredSet){
  fitCanvas(map);
  for(let y=0;y<map.h;y++) for(let x=0;x<map.w;x++) drawTileBase(x,y);
  const hitWp = state && state.hitWaypoints ? state.hitWaypoints : new Set();
  for(let y=0;y<map.h;y++) for(let x=0;x<map.w;x++){
    const c = map.grid[y][x], gx = x*TILE, gy = y*TILE;
    if(c === "#") drawBuilding(gx,gy);
    else if(c === "T") drawTree(gx,gy);
    else if(c === "W") drawStorm(gx,gy);
    else if(c === "H") drawHome(gx,gy);
    else if(c === "*") drawWaypoint(gx,gy, hitWp.has(x+","+y));
    else if(/[A-G]/.test(c)) drawPad(gx,gy,c, deliveredSet && deliveredSet.has(c));
  }
  if(state) drawDrone(state.px, state.py, state.heading, state.flying, state.roll);
}

function staticView(map){
  render(map, {px:(map.start.x+.5)*TILE, py:(map.start.y+.5)*TILE, heading:0, flying:false, roll:0, hitWaypoints:new Set()}, new Set());
}

/* Steps through the frame list, interpolating between tiles. */
function animate(map, frames, onDone){
  cancelAnimate();
  if(!frames || !frames.length){ onDone && onDone(); return; }
  const delivered = new Set(), hitWp = new Set();
  let i = 0, t = 0;
  let last = performance.now();
  // drone.speed() is real easytello, so it drives the playback rate too
  const stepFor = f => Math.max(45, Math.min(360, 130 * (30 / (f.speed || 30))));

  function frame(now){
    const dt = now - last; last = now;
    t += dt;
    let step = stepFor(frames[i]);
    while(t >= step && i < frames.length - 1){
      t -= step; i++;
      const f = frames[i];
      if(f.event === "deliver"){
        const pad = Object.keys(map.pads).find(k => map.pads[k].x===f.x && map.pads[k].y===f.y);
        if(pad) delivered.add(pad);
      }
      if(map.grid[f.y][f.x] === "*") hitWp.add(f.x + "," + f.y);
      step = stepFor(f);
    }
    const a = frames[i], b = frames[Math.min(i+1, frames.length-1)];
    const k = (i < frames.length-1) ? Math.min(t/step, 1) : 0;
    render(map, {
      px:((a.x + (b.x-a.x)*k) + .5) * TILE,
      py:((a.y + (b.y-a.y)*k) + .5) * TILE,
      heading:b.heading, flying:a.flying, hitWaypoints:hitWp,
      // a roll only ever winds forward; 1 and 0 are the same pose
      roll:(() => { const ra = a.roll || 0, rb = (b.roll || 0) < ra ? 1 : (b.roll || 0);
                    return ra + (rb - ra) * k; })()
    }, delivered);

    if(i < frames.length - 1) anim = requestAnimationFrame(frame);
    else { anim = null; onDone && onDone(); }
  }
  anim = requestAnimationFrame(frame);
}
function cancelAnimate(){ if(anim){ cancelAnimationFrame(anim); anim = null; } }

const $ = id => document.getElementById(id);
let editor, pyodide = null, pyReady = false, idx = 0, mode = "learn", lastFrames = null;

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE)) || {}; }catch(e){ return {}; }
}
function saveState(s){
  try{ localStorage.setItem(STORAGE, JSON.stringify(s)); }catch(e){}
}
let store = loadState();
store.done = store.done || {};
store.code = store.code || {};
store.layout = store.layout || {};

/* ---------------------------- UI ---------------------------- */

function level(){ return LEVELS[idx]; }
function chapter(){ return CHAPTERS[level().chapter]; }
function levelNumberInChapter(){
  return LEVELS.slice(0, idx+1).filter(l => l.chapter === level().chapter).length;
}

function renderChrome(){
  const L = level(), C = chapter();
  $("chapTitle").textContent = "Chapter " + (L.chapter+1) + " > Level " + levelNumberInChapter();
  $("lessonTitle").textContent = C.name;
  $("lessonSub").textContent = L.title;
  $("prevBtn").disabled = idx === 0;
  $("nextBtn").disabled = idx === LEVELS.length - 1;
  $("brief").innerHTML = L.brief;
  $("learnBody").innerHTML = C.learn;

  const pips = $("pips"); pips.innerHTML = "";
  LEVELS.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "pip" + (store.done[i] ? " done" : "") + (i === idx ? " current" : "");
    b.textContent = i + 1;
    b.title = "Chapter " + (l.chapter+1) + " — " + l.title;
    b.onclick = () => go(i);
    pips.appendChild(b);
  });

  $("legend").textContent = "";
  const pads = Object.keys(currentMap.pads).filter(p => p !== "H").sort();
  const bits = ["H home"];
  if(pads.length) bits.push(pads.length > 1 ? pads[0] + "-" + pads[pads.length-1] + " pads" : pads[0] + " pad");
  bits.push("# building", "T tree");
  if(L.map.join("").includes("W")) bits.push("W storm");
  if(L.map.join("").includes("*")) bits.push("✦ waypoint");
  $("legend").textContent = bits.join("   ");
}

function setMode(m){
  mode = m;
  $("learnPane").hidden = (m !== "learn");
  $("codePane").hidden  = (m !== "code");
  $("modeToggle").innerHTML = (m === "learn") ? "&lt;&gt; Back to coding" : "&#9662; Learn";
  if(m === "code" && editor) setTimeout(() => editor.resize(), 0);
}

function go(i){
  if(i < 0 || i >= LEVELS.length) return;
  idx = i;
  store.last = i; saveState(store);
  cancelAnimate();
  currentMap = parseMap(level().map);
  renderChrome();
  editor.setValue(store.code[i] != null ? store.code[i] : level().starter, -1);
  staticView(currentMap);
  layoutCanvas();
  say("");
  $("console").classList.remove("show");
  setMode(store.done[i] ? "code" : "learn");
  lastFrames = null;
}

function say(html, cls){
  const c = $("console");
  if(!html){ c.innerHTML = ""; c.classList.remove("show"); return; }
  c.innerHTML = cls ? '<span class="' + cls + '">' + html + "</span>" : html;
  c.classList.add("show");
}
function esc(s){ return String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }

/* ---------------------------- run ---------------------------- */

async function boot(){
  $("status").textContent = "Loading Python…";
  pyodide = await loadPyodide({ indexURL:"https://cdn.jsdelivr.net/pyodide/v314.0.3/full/" });
  pyodide.runPython(PRELUDE);
  pyReady = true;
  $("status").textContent = "Python ready";
  $("runBtn").disabled = false;
}

async function run(){
  if(!pyReady){ say("Python is still loading — give it a second.", "note"); return; }
  const L = level();
  cancelAnimate();
  $("runBtn").disabled = true;
  $("status").textContent = "Flying…";
  say("Running your code…", "note");

  const src = editor.getValue();
  store.code[idx] = src; saveState(store);

  // Fly every case; stop at the first one that fails so that is the flight
  // the camper watches. If all pass, the last case is the one animated.
  const cases = levelCases(L);
  const multi = cases.length > 1;
  let shown = null;
  for(let n = 0; n < cases.length; n++){
    const c = cases[n];
    const tag = multi ? '<span class="note">[' + (n+1) + "/" + cases.length + "] " + esc(c.label || "case " + (n+1)) + "</span>\n" : "";

    let res;
    try{
      pyodide.globals.set("STUDENT_SRC", src);
      pyodide.globals.set("LEVEL_JSON", JSON.stringify({inject: c.inject || {}, battery: c.battery == null ? 87 : c.battery}));
      res = JSON.parse(pyodide.runPython("run_mission(STUDENT_SRC, LEVEL_JSON)"));
    }catch(e){
      finishRun();
      say(tag + "Something went wrong running your code:\n" + esc(e.message || e), "bad");
      return;
    }

    const out = tag + (res.stdout ? esc(res.stdout).replace(/\n$/, "") + "\n" : "");

    if(!res.ok){
      finishRun();
      say(out + '<span class="bad">' + esc(res.error) + "</span>");
      return;
    }
    // with several cases, doing nothing can be the right call for one of them
    if(!res.log.length && !multi){
      finishRun();
      say(out + '<span class="note">Your code ran, but it never told the drone to do anything. Start with drone.takeoff().</span>');
      return;
    }

    let sim, verdict;
    try{
      sim = simulate(res.log, currentMap);
    }catch(e){
      finishRun();
      say(out + '<span class="bad">The flight simulator hit a problem: ' + esc(e.message || e) + "</span>");
      return;
    }
    try{
      verdict = grade(L, res, sim, c);
    }catch(e){
      verdict = {pass:false, msg:"The mission checker hit a problem: " + (e.message || e)};
    }
    // on a full pass, show the busiest flight rather than whichever came last
    if(!verdict.pass || !shown || res.log.length > shown.size) shown = {sim, out, verdict, size: res.log.length};
    if(!verdict.pass) break;
  }
  lastFrames = shown.sim.frames;

  animate(currentMap, shown.sim.frames, () => {
    // whatever the verdict, the run has to end with a usable page
    finishRun();
    if(shown.verdict.pass){
      store.done[idx] = true; saveState(store);
      renderChrome();
      say(shown.out + '<span class="ok">Mission complete' +
          (multi ? " — passed all " + cases.length + " cases." : ".") + "</span>");
      celebrate();
    }else{
      say(shown.out + '<span class="bad">' + esc(shown.verdict.msg) + "</span>");
    }
  });
}

function finishRun(){
  $("runBtn").disabled = false;
  $("status").textContent = "Python ready";
}

/* ---------------------------- modals ---------------------------- */

function showModal(html){
  $("modal").innerHTML = html;
  $("modal").className = "modal";
  $("scrim").classList.add("show");
}
function showHelpModal(html){
  $("modal").innerHTML = html;
  $("modal").className = "modal help";
  $("scrim").classList.add("show");
}
function closeModal(){ $("scrim").classList.remove("show"); }
$("scrim").onclick = e => { if(e.target === $("scrim")) closeModal(); };

function celebrate(){
  const done = Object.keys(store.done).filter(k => store.done[k]).length;
  const last = idx === LEVELS.length - 1;
  showModal(
    "<h2>" + (last ? "Dispatch complete!" : "You made it!") + "</h2>" +
    '<div class="lvl">Chapter ' + (level().chapter+1) + " &middot; " + esc(level().title) + "</div>" +
    "<p>" + (last
      ? "Every chapter cleared — from your first variable to classes, error handling and sorting. That is real Python. Take it to a real Tello."
      : esc(level().milestone ? level().milestone + " " : "") +
        "Level cleared. " + done + " of " + LEVELS.length + " missions done.") + "</p>" +
    '<div class="mrow">' +
      '<button class="tool" onclick="closeModal()">Stay here</button>' +
      (last ? "" : '<button class="run" onclick="closeModal();go(' + (idx+1) + ')">Continue &raquo;</button>') +
    "</div>"
  );
}

function showHint(){
  const L = level();
  showHelpModal(
    "<h2>Hint</h2><p>" + esc(L.hint) + "</p>" +
    '<div class="mrow">' +
      '<button class="tool" onclick="closeModal()">Close</button>' +
      '<button class="tool" onclick="revealSolution()">Show a working answer</button>' +
    "</div>"
  );
}
function revealSolution(){
  editor.setValue(level().solution, -1);
  store.code[idx] = level().solution; saveState(store);
  closeModal();
  setMode("code");
  say("One working answer loaded. Read it, run it, then try to rewrite it yourself.", "note");
}
function mapInfo(){
  const L = level();
  const fmt = obj => Object.keys(obj).map(k =>
    "<code>" + esc(k) + " = " + esc(JSON.stringify(obj[k])) + "</code>").join("<br>");
  const inj = L.cases
    ? "Your code is flown once for each of these:<br>" + L.cases.map(c => fmt(c.inject || {})).join("<br>")
    : (L.inject ? fmt(L.inject) : "");
  showHelpModal(
    "<h2>Map info</h2>" +
    "<p><b>" + esc(L.title) + "</b> &mdash; " + L.brief + "</p>" +
    "<p>Every tile is <b>10&nbsp;cm</b>. <code>H</code> is home, letters are landing pads, " +
    "<code>#</code> and <code>T</code> are solid, <code>W</code> is storm, <b>&#10022;</b> is a waypoint to fly over.</p>" +
    (inj ? "<p>Mission control gave you:<br>" + inj + "</p>" : "") +
    '<div class="mrow"><button class="tool" onclick="closeModal()">Close</button></div>'
  );
}

/* ---------------------------- splitter ---------------------------- */

function setupSplitter(){
  const shell = $("shell"), gutter = $("gutter");
  const MIN_LEFT = 320, MIN_RIGHT = 300;
  if(store.layout.col) shell.style.setProperty("--col-left", store.layout.col);

  function setCol(pxWidth){
    const total = shell.clientWidth;
    const clamped = Math.max(MIN_LEFT, Math.min(pxWidth, total - MIN_RIGHT - 7));
    const pct = (clamped / total * 100).toFixed(2) + "%";
    shell.style.setProperty("--col-left", pct);
    store.layout.col = pct; saveState(store);
    layoutCanvas();
  }
  gutter.addEventListener("pointerdown", e => {
    gutter.setPointerCapture(e.pointerId);
    gutter.classList.add("dragging"); document.body.classList.add("resizing");
  });
  gutter.addEventListener("pointermove", e => {
    if(!gutter.classList.contains("dragging")) return;
    setCol(e.clientX - shell.getBoundingClientRect().left);
  });
  const end = e => {
    if(!gutter.classList.contains("dragging")) return;
    gutter.classList.remove("dragging"); document.body.classList.remove("resizing");
    try{ gutter.releasePointerCapture(e.pointerId); }catch(_){}
    if(editor) editor.resize();
  };
  gutter.addEventListener("pointerup", end);
  gutter.addEventListener("pointercancel", end);
  gutter.addEventListener("dblclick", () => {
    shell.style.setProperty("--col-left", "46%");
    store.layout.col = "46%"; saveState(store);
    if(editor) editor.resize();
    layoutCanvas();
  });
  gutter.addEventListener("keydown", e => {
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    setCol($("shell").querySelector(".left").clientWidth + (e.key === "ArrowLeft" ? -24 : 24));
    if(editor) editor.resize();
  });
}

/* ---------------------------- wiring ---------------------------- */

function init(){
  editor = ace.edit("editor", {
    mode:"ace/mode/python",
    theme:"ace/theme/tomorrow_night_eighties",
    fontSize:14,
    showPrintMargin:false,
    tabSize:4,
    useSoftTabs:true,
    highlightActiveLine:true
  });
  editor.session.on("change", () => { store.code[idx] = editor.getValue(); });

  $("runBtn").disabled = true;
  $("runBtn").onclick = run;
  $("resetBtn").onclick = () => {
    editor.setValue(level().starter, -1);
    delete store.code[idx]; saveState(store);
    cancelAnimate(); staticView(currentMap); say("Back to the starter code.", "note");
  };
  $("saveBtn").onclick = () => {
    store.code[idx] = editor.getValue(); saveState(store);
    say("Saved to this browser.", "note");
  };
  $("loadBtn").onclick = () => {
    const fresh = loadState();
    if(fresh.code && fresh.code[idx] != null){
      editor.setValue(fresh.code[idx], -1); say("Loaded your saved code.", "note");
    }else{
      say("Nothing saved for this level yet.", "note");
    }
  };
  $("helpBtn").onclick = showHint;
  $("mapInfoBtn").onclick = mapInfo;
  $("replayBtn").onclick = () => {
    if(lastFrames) animate(currentMap, lastFrames);
    else say("Run your code first — then Replay plays the flight again.", "note");
  };
  $("modeToggle").onclick = () => setMode(mode === "learn" ? "code" : "learn");
  $("prevBtn").onclick = () => go(idx - 1);
  $("nextBtn").onclick = () => go(idx + 1);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

  setupSplitter();
  go(Number.isInteger(store.last) && LEVELS[store.last] ? store.last : 0);
  boot();
}

window.closeModal = closeModal;
window.revealSolution = revealSolution;
window.go = go;
init();
</script>
